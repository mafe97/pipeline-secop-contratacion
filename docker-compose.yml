# Pipeline SECOP II: Kafka (KRaft) + HDFS + contenedor de trabajo (Python/PySpark)
name: secop

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: secop-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data

  namenode:
    build:
      context: .
      dockerfile: Dockerfile.namenode
    image: secop-namenode:latest
    container_name: secop-namenode
    environment:
      CLUSTER_NAME: secop
    env_file: hadoop.env
    ports:
      - "127.0.0.1:9871:9870"   # interfaz web del NameNode
    volumes:
      - namenode_data:/hadoop/dfs/name
      - ./pipeline/mapreduce:/mr:ro      # mapper.py y reducer.py para Hadoop Streaming

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: secop-datanode
    env_file: hadoop.env
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
    depends_on: [namenode]
    volumes:
      - datanode_data:/hadoop/dfs/data

  pipeline:
    build: .
    image: secop-pipeline:latest
    container_name: secop-pipeline
    working_dir: /app
    command: sleep infinity          # contenedor de trabajo: se entra con docker compose exec
    environment:
      DATA_DIR: /app/data
      KAFKA_BOOTSTRAP: kafka:9092
      HDFS_WEB: http://namenode:9870
      SOCRATA_APP_TOKEN: ${SOCRATA_APP_TOKEN:-}
      INGEST_DESDE: ${INGEST_DESDE:-2026-10-25T00:00:00}
      INGEST_HASTA: ${INGEST_HASTA:-2026-11-05T00:00:00}
    volumes:
      - .:/app
      - ivy_cache:/root/.ivy2
    depends_on: [kafka, namenode, datanode]

volumes:
  kafka_data:
  namenode_data:
  datanode_data:
  ivy_cache:
